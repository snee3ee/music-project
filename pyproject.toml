[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-project"
version = "0.2.5.dev0"
description = "Local-first audio library intelligence with explicit uncertainty"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "streamlit>=1.57,<2",
  "matplotlib>=3.10,<4", "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["music_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["legacy_reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["music_project.core.config.Settings", "Settings"]
